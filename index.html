<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Story Spill</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f4ef; color: #191919; }
    main { width: min(680px, calc(100% - 40px)); padding: 52px; border: 2px solid #191919; border-radius: 24px; background: #fff; box-shadow: 10px 10px 0 #ff5a3d; }
    .eyebrow { color: #ff4d2e; font-size: .78rem; font-weight: 800; letter-spacing: .14em; }
    h1 { margin: 14px 0 12px; font-size: clamp(2.5rem, 7vw, 4.5rem); line-height: .95; }
    p { max-width: 58ch; color: #4b4b4b; font-size: 1.05rem; line-height: 1.65; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    a { color: #191919; font-weight: 750; text-decoration: none; border: 2px solid #191919; border-radius: 999px; padding: 10px 16px; }
    a:hover { background: #191919; color: #fff; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">STORY SPILL</div>
    <h1>Stories made for short-form video.</h1>
    <p>Story Spill is a personal, locally run tool that helps its owner write, render, review, and publish original narrated story videos to their connected YouTube channel.</p>
    <nav aria-label="Legal information">
      <a href="privacy.html">Privacy policy</a>
      <a href="terms.html">Terms of use</a>
    </nav>
  </main>
</body>
</html>
